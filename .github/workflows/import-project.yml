name: Import cloud-crushing project

on:
  push:
    paths:
      - .github/workflows/import-project.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4

      - name: Copy Cloud Crushing Studio from the personal site repository
        run: |
          git clone --depth 1 https://github.com/KaanBoge/kaanboge.github.io.git source
          cp -R source/cloud-studio/. .
          touch .nojekyll
          printf '%s\n' '# Cloud Crushing Problem' '' 'Cloud Crushing Studio and simulation results for the cloud-crushing problem.' '' '- [Open Cloud Crushing Studio](https://kaanboge.github.io/cloud-crushing-problem/)' > README.md
          rm -rf source
          git config user.name "KaanBoge"
          git config user.email "294922497+KaanBoge@users.noreply.github.com"
          git add -A
          git commit -m "Move Cloud Crushing Studio into dedicated repository"
          git push
