<!doctype html>
<meta charset="utf-8">
<title>Cloud Crushing &mdash; 3D viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#0a0d16; --panel:rgba(16,20,32,.85); --line:rgba(255,255,255,.13);
    --fg:#e8ecf6; --mut:#98a2bb; --acc:#6ea8ff; --acc2:#ffb46e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  canvas.view{display:block;width:100%;height:100%;outline:none}
  #wrap{position:fixed;inset:0;display:grid;grid-template-columns:1fr}
  #wrap.split{grid-template-columns:1fr 1fr}
  .pane{position:relative;min-width:0}
  .pane+.pane{border-left:1px solid var(--line)}
  .ptitle{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    font-size:13px;color:var(--mut);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px 12px;white-space:nowrap;pointer-events:none}
  .ptitle b{color:var(--fg);font-weight:600}

  .card{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.45)}
  #side{top:14px;left:14px;width:302px;max-height:calc(100vh - 28px);
    overflow:auto;padding:14px 14px 10px;z-index:5}
  #side h1{margin:0 0 2px;font-size:15px;font-weight:650}
  #side .sub{color:var(--mut);font-size:12px;margin:0 0 10px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);
    margin:12px 0 6px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips button{all:unset;cursor:pointer;padding:4px 9px;border-radius:999px;font-size:12px;
    border:1px solid var(--line);color:var(--mut)}
  .chips button.on{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.5);color:var(--fg)}
  #runs{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  #runs .grp{font-size:11.5px;font-weight:650;color:var(--mut);margin:8px 0 2px;
    text-transform:uppercase;letter-spacing:.06em}
  #runs button{all:unset;cursor:pointer;padding:6px 9px;border-radius:8px;font-size:12.5px;
    border:1px solid transparent;display:flex;justify-content:space-between;gap:8px}
  #runs button:hover{background:rgba(255,255,255,.06)}
  #runs button.on{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.45)}
  #runs button .m{color:var(--mut);font-size:11.5px;white-space:nowrap}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);cursor:pointer}
  .chk input{accent-color:var(--acc);cursor:pointer}
  select{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:5px 7px;font-size:12px;max-width:100%}
  a.back{color:var(--acc);text-decoration:none;font-size:12px}

  #bar{left:50%;transform:translateX(-50%);bottom:14px;padding:10px 14px;z-index:5;
    display:flex;align-items:center;gap:12px;min-width:min(760px,calc(100vw - 28px))}
  #bar button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:8px;
    display:grid;place-items:center;border:1px solid var(--line);font-size:13px}
  #bar button:hover{background:rgba(255,255,255,.08)}
  #slider{flex:1;accent-color:var(--acc);cursor:pointer}
  #tlab{min-width:112px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px}

  #hud{top:14px;right:14px;padding:9px 12px;font-size:12px;color:var(--mut);
    text-align:right;line-height:1.6;z-index:5}
  #hud b{color:var(--fg);font-weight:600}

  #chartcard{right:14px;bottom:70px;width:330px;padding:10px 12px 6px;z-index:5}
  #chartcard .lbl{margin-top:0}
  #chart{width:100%;height:150px;display:block}
  #chartnote{font-size:11px;color:var(--mut);margin:2px 0 4px}
  .sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  #msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--mut);
    font-size:13px;pointer-events:none;z-index:4}
</style>

<div id="wrap"><div class="pane" id="paneA"><canvas class="view" id="cvA"></canvas>
  <div class="ptitle" id="titleA">&mdash;</div></div></div>
<div id="msg">loading&hellip;</div>

<div class="card" id="side">
  <h1>3D viewer</h1>
  <p class="sub">Drag to turn &middot; scroll to zoom &middot; right-drag to pan
    &middot; <a class="back" href="index.html">back to studio</a></p>
  <div class="lbl">Overdensity</div>
  <div class="chips" id="chiChips">
    <button data-chi="all" class="on">all</button><button data-chi="10">&chi; = 10</button>
    <button data-chi="100">&chi; = 100</button><button data-chi="1000">&chi; = 1000</button>
  </div>
  <div class="lbl">Level</div>
  <div class="chips" id="lvlChips">
    <button data-lvl="all" class="on">all</button><button data-lvl="3">3</button>
    <button data-lvl="4">4</button><button data-lvl="5">5</button><button data-lvl="6">6</button>
  </div>
  <div class="lbl">Run</div>
  <label class="chk" style="margin-bottom:6px"><input type="checkbox" id="hideLegacy">
    hide legacy runs (17-frame only)</label>
  <div id="runs"></div>
  <div class="lbl">Compare</div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="cmpOn"> side by side</label>
    <label class="chk"><input type="checkbox" id="cmpLink" checked> link cameras</label>
  </div>
  <select id="cmpSel" style="margin-top:6px;width:100%" disabled></select>
  <div class="lbl">Quality</div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="qShadow" checked> shadow</label>
    <label class="chk"><input type="checkbox" id="qBox" checked> box</label>
    <label class="chk"><input type="checkbox" id="qSpin"> spin</label>
    <select id="qScale"><option value="1">1&times;</option><option value="1.5">1.5&times;</option>
      <option value="2" selected>2&times;</option><option value="3">3&times;</option></select>
  </div>
  <div class="lbl">Shells</div>
  <div id="shells" class="row"></div>
</div>

<div class="card" id="hud">
  <div><b id="fps">&mdash;</b> fps</div>
  <div><b id="tris">&mdash;</b> triangles</div>
</div>

<div class="card" id="chartcard">
  <div class="lbl">Surviving dense mass</div>
  <canvas id="chart" width="640" height="300"></canvas>
  <div id="chartnote">fraction of total mass still at cloud density, vs t/t_cc</div>
</div>

<div class="card" id="bar">
  <button id="prev">&#9664;</button>
  <button id="play">&#9654;</button>
  <button id="next">&#9654;&#9654;</button>
  <input id="slider" type="range" min="0" max="0" value="0" step="1">
  <span id="tlab">&mdash;</span>
</div>

<script>var STUDIO_DATA={},VOL_DATA={},VOLSEQ_DATA={},VOLHQ_DATA={};</script>
<script src="data/manifest.js"></script>
<script src="data/densemap.js"></script>
<script type="importmap">
  {"imports": {"three": "./vendor/three.module.js",
               "three/addons/": "./vendor/addons/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const XL = [-3, 17], YL = [-5, 5], ZL = [-5, 5];
const msg = document.getElementById("msg");
const qScale = document.getElementById("qScale");

// ------------------------------------------------------------------ data ids
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}
let ids = (window.STUDIO_VOLS || []).map(s => String(s).replace(/^volhq_|^vol_seq_|^vol_/, ""))
          .concat(typeof DENSE_RUNS !== "undefined" ? Object.keys(DENSE_RUNS) : [])
          .filter((v, i, a) => a.indexOf(v) === i)
          .filter(id => !/_(384|448|1800|3600|7200|8192)(_|$)/.test(id));

const CODE_OF = { apk: "AthenaPK (GPU)", apk3d: "AthenaPK (GPU)", athpp: "Athena++",
  athpp3d: "Athena++", athw: "Athena 4.2", athw3d: "Athena 4.2", f: "FLASH 4.8", f3d: "FLASH 4.8",
  flash: "FLASH 4.8", flashx: "Flash-X", enzo: "Enzo", arepo: "Arepo",
  gzmfm: "GIZMO MFM", gzmfv: "GIZMO MFV", g4: "Gadget-4", gas: "Gasoline" };
function meta(id) {
  const pre = (id.match(/^([a-z0-9]+?)(?:3d)?_/) || [, ""])[1];
  const chi = +((id.match(/chi(\d+)/) || [, 0])[1]);
  // magnetized runs are their own physics, never merged with hydro entries
  const mhd = id.match(/_mhd_b(\d+)_/);
  let lvl = null;
  let m = id.match(/_[lL](\d)\b|_[lL](\d)(?:m|hq|_)/);
  if (m) lvl = +(m[1] || m[2]);
  else if ((m = id.match(/_(\d{3,4})(?:_|$)/))) {
    const L = Math.log2(+m[1]) - 3;
    if (Math.abs(L - Math.round(L)) < 0.02) lvl = Math.round(L);
  }
  let code = CODE_OF[pre] || pre;
  if (mhd) code += " MHD β=" + mhd[1];
  return { code, chi, lvl };
}
// only integer-ladder entries with an identifiable level
ids = ids.filter(id => meta(id).lvl !== null);
// one entry per (code, chi, level): the new-style tags (apk_L5_chi10) carry the
// diagnostics and the freshest exports, so they win over old-style duplicates
ids.sort((a, b) => (/3d/.test(a) ? 1 : 0) - (/3d/.test(b) ? 1 : 0));
{
  const seen = new Set();
  ids = ids.filter(id => {
    const m = meta(id), k = m.code + "|" + m.chi + "|" + m.lvl;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}

// ------------------------------------------------------------------- panes
function bytes(b64) {
  const raw = atob(b64), n = raw.length, buf = new Uint8Array(n);
  for (let i = 0; i < n; i++) buf[i] = raw.charCodeAt(i);
  return buf;
}
function decode(s) {
  const buf = bytes(s.pos);
  if (!s.qlo) return new Float32Array(buf.buffer);
  const q = new Uint16Array(buf.buffer), out = new Float32Array(q.length);
  const lo = s.qlo, hi = s.qhi;
  const sx = (hi[0]-lo[0])/65535, sy = (hi[1]-lo[1])/65535, sz = (hi[2]-lo[2])/65535;
  for (let i = 0; i < q.length; i += 3) {
    out[i] = lo[0]+q[i]*sx; out[i+1] = lo[1]+q[i+1]*sy; out[i+2] = lo[2]+q[i+2]*sz;
  }
  return out;
}

function makePane(cv) {
  const p = {};
  p.ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
  p.ren.setClearColor(0x0a0d16, 1);
  p.ren.toneMapping = THREE.ACESFilmicToneMapping;
  p.ren.shadowMap.enabled = true;
  p.ren.shadowMap.type = THREE.PCFSoftShadowMap;
  p.scene = new THREE.Scene();
  p.scene.fog = new THREE.Fog(0x0a0d16, 26, 70);
  p.cam = new THREE.PerspectiveCamera(42, 2, 0.05, 500);
  p.cam.up.set(0, 0, 1);
  p.cam.position.set(14, -17, 10);
  p.ctrl = new OrbitControls(p.cam, cv);
  p.ctrl.enableDamping = true; p.ctrl.dampingFactor = 0.075;
  p.ctrl.target.set(5, 0, 0);
  p.scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x202634, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(9, -14, 16); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 80;
  key.shadow.camera.left = -14; key.shadow.camera.right = 24;
  key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
  p.scene.add(key);
  const rim = new THREE.DirectionalLight(0x9dc0ff, 0.7); rim.position.set(-10, 8, -6); p.scene.add(rim);
  p.boxG = new THREE.Group();
  const g = new THREE.BoxGeometry(XL[1]-XL[0], YL[1]-YL[0], ZL[1]-ZL[0]);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g),
      new THREE.LineBasicMaterial({ color: 0x4a5570, transparent: true, opacity: 0.55 }));
  e.position.set((XL[0]+XL[1])/2, 0, 0); p.boxG.add(e);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(XL[1]-XL[0], YL[1]-YL[0]),
      new THREE.ShadowMaterial({ opacity: 0.34 }));
  floor.position.set((XL[0]+XL[1])/2, 0, ZL[0]+0.01); floor.receiveShadow = true;
  p.boxG.add(floor);
  p.scene.add(p.boxG);
  p.root = new THREE.Group(); p.scene.add(p.root);
  p.frames = []; p.times = []; p.cur = 0; p.id = null; p.tris = 0;
  p.cv = cv; p.lastW = 0; p.lastH = 0;
  return p;
}

function clearPane(p) {
  p.root.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  p.scene.remove(p.root);
  p.root = new THREE.Group(); p.scene.add(p.root);
  p.frames = []; p.times = []; p.tris = 0;
  if (p.dense) {
    p.dense.cache.forEach(g => g.traverse(o => {
      if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose();
    }));
  }
  p.dense = null;
}

// ------------------------------------------------- dense streaming frames
// Every snapshot of a run, fetched on demand from the frames branch as
// indexed gzipped meshes. The site itself stays under the 1 GB Pages cap
// because this data never enters the published bundle.
async function denseFetch(p, i) {
  const d = p.dense;
  if (d.cache.has(i)) return d.cache.get(i);
  if (d.pending.has(i)) return d.pending.get(i);
  const job = (async () => {
    const r = await fetch(d.base + d.tag + "/" + d.index.frames[i], { cache: "force-cache" });
    if (!r.ok) throw new Error("frame " + i + ": " + r.status);
    let buf;
    if (typeof DecompressionStream !== "undefined") {
      buf = await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    } else {
      buf = await r.arrayBuffer();       // very old browsers: served raw would fail; acceptable
    }
    const dv = new DataView(buf);
    let o = 0;
    const nsh = dv.getUint8(o); o += 1;
    const grp = new THREE.Group();
    for (let s = 0; s < nsh; s++) {
      const level = dv.getFloat32(o, true); o += 4;
      const op = dv.getFloat32(o, true); o += 4;
      const col = [dv.getFloat32(o, true), dv.getFloat32(o + 4, true), dv.getFloat32(o + 8, true)]; o += 12;
      const qlo = [dv.getFloat32(o, true), dv.getFloat32(o + 4, true), dv.getFloat32(o + 8, true)]; o += 12;
      const qhi = [dv.getFloat32(o, true), dv.getFloat32(o + 4, true), dv.getFloat32(o + 8, true)]; o += 12;
      const nv = dv.getUint32(o, true); o += 4;
      const nf = dv.getUint32(o, true); o += 4;
      const q = new Uint16Array(buf.slice(o, o + nv * 6)); o += nv * 6;
      const faces = new Uint32Array(buf.slice(o, o + nf * 12)); o += nf * 12;
      const pos = new Float32Array(nv * 3);
      const sx = (qhi[0] - qlo[0]) / 65535, sy = (qhi[1] - qlo[1]) / 65535, sz = (qhi[2] - qlo[2]) / 65535;
      for (let k = 0; k < nv * 3; k += 3) {
        pos[k] = qlo[0] + q[k] * sx; pos[k + 1] = qlo[1] + q[k + 1] * sy; pos[k + 2] = qlo[2] + q[k + 2] * sz;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setIndex(new THREE.BufferAttribute(new Uint32Array(faces), 1));
      geo.computeVertexNormals();
      const opaque = op >= 0.9;
      const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(col[0], col[1], col[2]),
        transparent: !opaque, opacity: op, roughness: 0.42,
        clearcoat: opaque ? 0.35 : 0, side: THREE.DoubleSide, depthWrite: opaque });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = opaque; mesh.userData.shell = s;
      grp.add(mesh);
    }
    d.pending.delete(i);
    d.cache.set(i, grp);
    d.order.push(i);
    while (d.order.length > 28) {                    // LRU: bound GPU memory
      const ev = d.order.shift();
      if (ev === p.cur || ev === i) { d.order.push(ev); break; }
      const g = d.cache.get(ev);
      if (g) {
        if (g.parent) g.parent.remove(g);
        g.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material) x.material.dispose(); });
        d.cache.delete(ev);
      }
    }
    return grp;
  })();
  d.pending.set(i, job);
  return job;
}
async function denseShow(p, i) {
  const d = p.dense;
  i = Math.max(0, Math.min(d.index.frames.length - 1, i));
  const token = ++d.token;
  let grp;
  try { grp = await denseFetch(p, i); } catch (e) { return; }
  if (token !== d.token) return;                     // a newer scrub superseded us
  if (d.shown && d.shown.parent) p.root.remove(d.shown);
  p.root.add(grp);
  grp.children.forEach(m => { if (shellOn.length) m.visible = shellOn[m.userData.shell] !== false; });
  d.shown = grp; p.cur = i;
  p.tris = (d.index.tris && d.index.tris[i]) || p.tris;
  updateHud();
  // prefetch neighbours so scrubbing stays fluid
  if (i + 1 < d.index.frames.length) denseFetch(p, i + 1).catch(() => {});
  if (i > 0) denseFetch(p, i - 1).catch(() => {});
}

async function loadRun(p, id, titleEl) {
  msg.textContent = "loading " + id + "…"; msg.style.display = "grid";
  clearPane(p); p.id = id;
  // dense first: every frame the run produced, streamed on demand
  if (typeof DENSE_RUNS !== "undefined" && DENSE_RUNS[id]) {
    try {
      const r = await fetch(DENSE_BASE + id + "/index.json", { cache: "no-cache" });
      if (r.ok) {
        const index = await r.json();
        p.dense = { tag: id, base: DENSE_BASE, index, cache: new Map(),
                    pending: new Map(), order: [], token: 0, shown: null };
        p.times = index.times || [];
        p.frames = { length: index.frames.length };   // slider sizing only
        const mt = meta(id);
        if (titleEl) titleEl.innerHTML = "<b>" + mt.code + "</b> &middot; &chi; = " + mt.chi +
          " &middot; level " + mt.lvl + " &middot; " + index.frames.length + " frames";
        buildShellTogglesDense();
        await denseShow(p, 0);
        setFrameAll(0);
        loadDiag(id, p === A ? 0 : 1);
        msg.style.display = "none";
        return;
      }
    } catch (e) { /* fall through to embedded volumes */ }
  }
  let seq = null;
  try { if (!VOLHQ_DATA[id]) await loadScript("data/volhq_" + id + ".js"); } catch (e) {}
  seq = VOLHQ_DATA[id];
  if (!seq) {
    try { if (!VOLSEQ_DATA[id]) await loadScript("data/vol_seq_" + id + ".js"); } catch (e) {}
    seq = VOLSEQ_DATA[id];
  }
  if (!seq || !seq.frames || !seq.frames.length) { msg.textContent = "no 3D data for " + id; return; }
  p.times = seq.times || [];
  let tri = 0;
  seq.frames.forEach((surfs, fi) => {
    const g = new THREE.Group(); g.visible = (fi === 0);
    (surfs || []).forEach((s, si) => {
      const pos = decode(s);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.computeVertexNormals();
      const opaque = s.opacity >= 0.9;
      const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(s.color[0], s.color[1], s.color[2]),
        transparent: !opaque, opacity: s.opacity, roughness: 0.42,
        clearcoat: opaque ? 0.35 : 0, side: THREE.DoubleSide, depthWrite: opaque });
      const mm = new THREE.Mesh(geo, mat);
      mm.castShadow = opaque; mm.userData.shell = si;
      g.add(mm);
      if (fi === 0) tri += pos.length / 9;
    });
    p.frames.push(g); p.root.add(g);
  });
  p.tris = Math.round(tri);
  const mt = meta(id);
  if (titleEl) titleEl.innerHTML = "<b>" + mt.code + "</b> &middot; &chi; = " + mt.chi + " &middot; level " + mt.lvl;
  setFrameAll(0);
  buildShellToggles();
  updateHud();
  loadDiag(id, p === A ? 0 : 1);
  msg.style.display = "none";
}

// ------------------------------------------------------------ frame control
const A = makePane(document.getElementById("cvA"));
let B = null;
window.__A = A;                       // diagnostics only
let shellOn = [];
function setFrame(p, i) {
  if (!p) return;
  if (p.dense) { denseShow(p, i); return; }
  if (!p.frames.length) return;
  p.frames[p.cur].visible = false;
  p.cur = Math.max(0, Math.min(p.frames.length - 1, i));
  p.frames[p.cur].visible = true;
  p.frames[p.cur].children.forEach(m => {
    if (shellOn.length) m.visible = shellOn[m.userData.shell] !== false;
  });
}
function buildShellTogglesDense() {
  const host = document.getElementById("shells"); host.innerHTML = "";
  shellOn = [true, true];
  ["outer", "core"].forEach((nm, i) => {
    const l = document.createElement("label"); l.className = "chk";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = true;
    c.onchange = () => {
      shellOn[i] = c.checked;
      [A, B].forEach(p => {
        if (p && p.dense && p.dense.shown)
          p.dense.shown.children.forEach(m => { m.visible = shellOn[m.userData.shell] !== false; });
        else if (p) setFrame(p, p.cur);
      });
    };
    l.appendChild(c); l.appendChild(document.createTextNode(nm));
    host.appendChild(l);
  });
}
function setFrameAll(i) {
  const nA = A.frames.length;
  const ni = Math.max(0, Math.min(nA - 1, i));
  A.curTarget = ni;
  setFrame(A, ni);
  if (B && B.frames.length) {
    const frac = nA > 1 ? ni / (nA - 1) : 0;
    setFrame(B, Math.round(frac * (B.frames.length - 1)));
  }
  const sl = document.getElementById("slider");
  sl.max = Math.max(nA - 1, 0); sl.value = ni;
  const t = A.times[ni];
  document.getElementById("tlab").textContent =
    (t !== undefined && t !== null && t !== "") ? "t = " + t + " t_cc" : (ni + 1) + " / " + nA;
  drawChart();
}
function buildShellToggles() {
  const host = document.getElementById("shells"); host.innerHTML = "";
  const n = A.frames[0] ? A.frames[0].children.length : 0;
  shellOn = new Array(n).fill(true);
  const names = ["outer", "core"];
  for (let i = 0; i < n; i++) {
    const l = document.createElement("label"); l.className = "chk";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = true;
    c.onchange = () => { shellOn[i] = c.checked; setFrameAll(A.cur); };
    l.appendChild(c); l.appendChild(document.createTextNode(names[i] || "shell " + (i+1)));
    host.appendChild(l);
  }
}
function updateHud() {
  document.getElementById("tris").textContent =
    (A.tris + (B ? B.tris : 0)).toLocaleString();
}

// --------------------------------------------------------------- run list
const state = { chi: "all", lvl: "all" };
function chip(hostId, key) {
  document.getElementById(hostId).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#" + hostId + " button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    state[key] = b.dataset[key === "chi" ? "chi" : "lvl"];
    buildList();
  });
}
chip("chiChips", "chi"); chip("lvlChips", "lvl");

const isDense = id => typeof DENSE_RUNS !== "undefined" && DENSE_RUNS[id] >= 8;
function visibleIds() {
  return ids.filter(id => {
    const m = meta(id);
    if (state.chi !== "all" && String(m.chi) !== state.chi) return false;
    if (state.lvl !== "all" && String(m.lvl) !== state.lvl) return false;
    if (document.getElementById("hideLegacy").checked && !isDense(id)) return false;
    return true;
  });
}
document.getElementById("hideLegacy").onchange = () => buildList();
function buildList() {
  const host = document.getElementById("runs"); host.innerHTML = "";
  const vis = visibleIds();
  const byCode = {};
  vis.forEach(id => { const c = meta(id).code; (byCode[c] = byCode[c] || []).push(id); });
  Object.keys(byCode).sort().forEach(code => {
    const h = document.createElement("div"); h.className = "grp"; h.textContent = code;
    host.appendChild(h);
    byCode[code].sort((a, b) => (meta(b).lvl - meta(a).lvl) || (meta(a).chi - meta(b).chi))
      .forEach(id => {
        const m = meta(id);
        const b = document.createElement("button");
        const fr = isDense(id) ? DENSE_RUNS[id] + "f" : "17f";
        b.innerHTML = "<span>&chi; = " + m.chi + "</span><span class='m'>level " + m.lvl +
                      " &middot; " + fr + "</span>";
        b.dataset.id = id;
        b.classList.toggle("on", id === A.id);
        b.onclick = () => {
          document.querySelectorAll("#runs button").forEach(x => x.classList.remove("on"));
          b.classList.add("on");
          stop(); loadRun(A, id, document.getElementById("titleA"));
          history.replaceState(null, "", "?run=" + encodeURIComponent(id) + (B && B.id ? "&vs=" + encodeURIComponent(B.id) : ""));
        };
        host.appendChild(b);
      });
  });
  // compare dropdown mirrors the filtered list
  const sel = document.getElementById("cmpSel");
  sel.innerHTML = "";
  vis.forEach(id => {
    const m = meta(id);
    const o = document.createElement("option");
    o.value = id; o.textContent = m.code + "  χ=" + m.chi + "  L" + m.lvl;
    sel.appendChild(o);
  });
}

// ---------------------------------------------------------------- compare
const cmpOn = document.getElementById("cmpOn");
const cmpSel = document.getElementById("cmpSel");
cmpOn.onchange = () => {
  cmpSel.disabled = !cmpOn.checked;
  const wrap = document.getElementById("wrap");
  if (cmpOn.checked) {
    if (!B) {
      const pane = document.createElement("div"); pane.className = "pane"; pane.id = "paneB";
      pane.innerHTML = '<canvas class="view" id="cvB"></canvas><div class="ptitle" id="titleB">&mdash;</div>';
      wrap.appendChild(pane);
      B = makePane(document.getElementById("cvB"));
    }
    document.getElementById("paneB").style.display = "";
    wrap.classList.add("split");
    const pick = cmpSel.value || (visibleIds().find(i => i !== A.id) || A.id);
    cmpSel.value = pick;
    loadRun(B, pick, document.getElementById("titleB"));
  } else {
    wrap.classList.remove("split");
    if (B) { document.getElementById("paneB").style.display = "none"; clearPane(B); B.id = null; }
    diagB = null; drawChart(); updateHud();
  }
};
cmpSel.onchange = () => { if (cmpOn.checked && B) { stop(); loadRun(B, cmpSel.value, document.getElementById("titleB")); } };

// ------------------------------------------------------------- diagnostics
let diagA = null, diagB = null;
async function loadDiag(id, slot) {
  let d = null;
  try {
    const r = await fetch("data/diag_" + id + ".json", { cache: "no-store" });
    if (r.ok) d = await r.json();
  } catch (e) {}
  if (slot === 0) diagA = d; else diagB = d;
  drawChart();
}
function drawChart() {
  const cv = document.getElementById("chart"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.lineWidth = 1;
  ctx.strokeRect(40, 8, W - 52, H - 42);
  ctx.fillStyle = "#98a2bb"; ctx.font = "20px sans-serif";
  ctx.fillText("0", 24, H - 30); ctx.fillText("1", 24, 24);
  ctx.fillText("0", 38, H - 12); ctx.fillText("5 t_cc", W - 70, H - 12);
  const X = t => 40 + (W - 52) * Math.min(Math.max(t / 5, 0), 1);
  const Y = v => 8 + (H - 50) * (1 - Math.min(Math.max(v, 0), 1));
  function line(d, color, dash) {
    if (!d || !d.series || !d.series.length) return;
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash(dash ? [8, 6] : []);
    ctx.beginPath();
    d.series.forEach((r, i) => { const x = X(r.t), y = Y(r.mass_frac); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke(); ctx.setLineDash([]);
  }
  line(diagA, "#6ea8ff", false);
  line(diagB, "#ffb46e", true);
  const t = parseFloat(A.times[A.cur]);
  if (isFinite(t)) {
    ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(t), 8); ctx.lineTo(X(t), H - 34); ctx.stroke();
  }
  const note = document.getElementById("chartnote");
  if (!diagA && !diagB) note.textContent = "no measured series for this run yet";
  else note.innerHTML = (diagA ? "<span class='sw' style='background:#6ea8ff'></span>" + (A.id||"") + " " : "")
                      + (diagB ? "&nbsp;<span class='sw' style='background:#ffb46e'></span>" + (B && B.id || "") : "");
}

// ---------------------------------------------------------------- playback
let timer = null;
const playBtn = document.getElementById("play");
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.innerHTML = "&#9654;"; } }
playBtn.onclick = () => {
  if (timer) return stop();
  playBtn.innerHTML = "&#10074;&#10074;";
  timer = setInterval(() => {
    const cur = (A.curTarget !== undefined) ? A.curTarget : A.cur;
    const next = (cur + 1) % Math.max(A.frames.length, 1);
    // streaming panes only advance onto frames that are ready, so playback
    // never outruns the network; the fetch is kicked regardless
    if (A.dense && !A.dense.cache.has(next)) { denseFetch(A, next).catch(() => {}); return; }
    setFrameAll(next);
  }, 90);
};
const curT = () => (A.curTarget !== undefined) ? A.curTarget : A.cur;
document.getElementById("prev").onclick = () => { stop(); setFrameAll(curT() - 1); };
document.getElementById("next").onclick = () => { stop(); setFrameAll(curT() + 1); };
document.getElementById("slider").oninput = e => { stop(); setFrameAll(+e.target.value); };
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  if (e.key === "ArrowLeft") { stop(); setFrameAll(curT() - 1); }
  if (e.key === "ArrowRight") { stop(); setFrameAll(curT() + 1); }
});
document.getElementById("qShadow").onchange = e => {
  [A, B].forEach(p => { if (p) p.ren.shadowMap.enabled = e.target.checked; });
};
document.getElementById("qBox").onchange = e => { [A, B].forEach(p => { if (p) p.boxG.visible = e.target.checked; }); };
let spin = false;
document.getElementById("qSpin").onchange = e => { spin = e.target.checked; };
qScale.onchange = () => { [A, B].forEach(p => { if (p) { p.lastW = 0; } }); };

// -------------------------------------------------------------- main loop
function resizePane(p) {
  const w = p.cv.clientWidth, h = p.cv.clientHeight;
  if (w === p.lastW && h === p.lastH) return;
  p.lastW = w; p.lastH = h;
  const dpr = Math.min(+qScale.value || 2, window.devicePixelRatio || 1, 3);
  p.ren.setPixelRatio(dpr); p.ren.setSize(w, h, false);
  p.cam.aspect = w / Math.max(h, 1); p.cam.updateProjectionMatrix();
}
let fCount = 0, fLast = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const link = document.getElementById("cmpLink").checked;
  [A, B].forEach(p => {
    if (!p || !p.cv.offsetParent) return;
    resizePane(p);
    p.ctrl.autoRotate = spin; p.ctrl.autoRotateSpeed = 0.8;
    p.ctrl.update();
  });
  if (B && link && B.cv.offsetParent) {
    B.cam.position.copy(A.cam.position);
    B.cam.quaternion.copy(A.cam.quaternion);
    B.ctrl.target.copy(A.ctrl.target);
  }
  [A, B].forEach(p => { if (p && p.cv.offsetParent) p.ren.render(p.scene, p.cam); });
  fCount++;
  if (now - fLast >= 500) {
    document.getElementById("fps").textContent = Math.round(fCount * 1000 / (now - fLast));
    fCount = 0; fLast = now;
  }
}
requestAnimationFrame(loop);

// ----------------------------------------------------------------- startup
buildList();
const q = new URLSearchParams(location.search);
const want = q.get("run");
const first = (want && ids.indexOf(want) >= 0) ? want : (visibleIds()[0] || null);
if (first) {
  const b = document.querySelector('#runs button[data-id="' + CSS.escape(first) + '"]');
  if (b) b.click(); else loadRun(A, first, document.getElementById("titleA"));
  const vs = q.get("vs");
  if (vs && ids.indexOf(vs) >= 0) {
    cmpOn.checked = true; cmpOn.onchange();
    cmpSel.value = vs; cmpSel.onchange();
  }
} else {
  msg.textContent = "no 3D volumes found";
}
</script>
