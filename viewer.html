<!doctype html>
<meta charset="utf-8">
<title>Cloud Crushing &mdash; 3D viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#0a0d16; --panel:rgba(16,20,32,.82); --line:rgba(255,255,255,.13);
    --fg:#e8ecf6; --mut:#98a2bb; --acc:#6ea8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%;outline:none}
  #wrap{position:fixed;inset:0}

  .pane{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.45)}
  #side{top:14px;left:14px;width:290px;max-height:calc(100vh - 28px);
    overflow:auto;padding:14px 14px 10px}
  #side h1{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:.01em}
  #side .sub{color:var(--mut);font-size:12px;margin:0 0 12px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);
    margin:14px 0 6px;font-weight:600}
  #runs{display:flex;flex-direction:column;gap:5px}
  #runs button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;
    border:1px solid transparent;font-size:12.5px;line-height:1.3}
  #runs button:hover{background:rgba(255,255,255,.06)}
  #runs button.on{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.45)}
  #runs button .m{display:block;color:var(--mut);font-size:11px;margin-top:2px}

  #bar{left:50%;transform:translateX(-50%);bottom:14px;padding:10px 14px;
    display:flex;align-items:center;gap:12px;min-width:min(720px,calc(100vw - 28px))}
  #bar button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:8px;
    display:grid;place-items:center;border:1px solid var(--line);font-size:13px}
  #bar button:hover{background:rgba(255,255,255,.08)}
  #slider{flex:1;accent-color:var(--acc);cursor:pointer}
  #tlab{min-width:118px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px}

  #hud{top:14px;right:14px;padding:9px 12px;font-variant-numeric:tabular-nums;
    font-size:12px;color:var(--mut);text-align:right;line-height:1.6}
  #hud b{color:var(--fg);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);cursor:pointer}
  .chk input{accent-color:var(--acc);cursor:pointer}
  a.back{color:var(--acc);text-decoration:none;font-size:12px}
  a.back:hover{text-decoration:underline}
  #msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--mut);
    font-size:13px;pointer-events:none}
  select{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:5px 7px;font-size:12px}
</style>

<div id="wrap"><canvas id="cv"></canvas></div>
<div id="msg">loading&hellip;</div>

<div class="pane" id="side">
  <h1>3D viewer</h1>
  <p class="sub">Drag to turn &middot; scroll to zoom &middot; right-drag to pan
    &middot; <a class="back" href="index.html">back to studio</a></p>
  <div class="lbl">Run</div>
  <div id="runs"></div>
  <div class="lbl">Quality</div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="qShadow" checked> shadow</label>
    <label class="chk"><input type="checkbox" id="qBox" checked> box</label>
    <label class="chk"><input type="checkbox" id="qSpin"> spin</label>
  </div>
  <div class="row" style="margin-top:8px">
    <span style="font-size:12px;color:var(--mut)">render</span>
    <select id="qScale">
      <option value="1">1&times;</option>
      <option value="1.5">1.5&times;</option>
      <option value="2" selected>2&times; (crisp)</option>
      <option value="3">3&times; (max)</option>
    </select>
  </div>
  <div class="lbl">Shells</div>
  <div id="shells" class="row"></div>
</div>

<div class="pane" id="hud">
  <div><b id="fps">&mdash;</b> fps</div>
  <div><b id="tris">&mdash;</b> triangles</div>
  <div id="gridinfo">&mdash;</div>
</div>

<div class="pane" id="bar">
  <button id="prev" title="Previous frame">&#9664;</button>
  <button id="play" title="Play">&#9654;</button>
  <button id="next" title="Next frame">&#9654;&#9654;</button>
  <input id="slider" type="range" min="0" max="0" value="0" step="1">
  <span id="tlab">&mdash;</span>
</div>

<script>var STUDIO_DATA={},VOL_DATA={},VOLSEQ_DATA={},VOLHQ_DATA={};</script>
<script src="data/manifest.js"></script>
<script type="importmap">
  {"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const msg = document.getElementById("msg");
const cv  = document.getElementById("cv");

// ---------------------------------------------------------------- renderer
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
ren.setClearColor(0x0a0d16, 1);
ren.toneMapping = THREE.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.05;
ren.shadowMap.enabled = true;
ren.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0d16, 26, 70);
const cam = new THREE.PerspectiveCamera(42, 2, 0.05, 500);
cam.position.set(14, -17, 10);
const ctrl = new OrbitControls(cam, cv);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.075;
ctrl.rotateSpeed = 0.85;
ctrl.target.set(5, 0, 0);

scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x202634, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(9, -14, 16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 80;
key.shadow.camera.left = -14; key.shadow.camera.right = 24;
key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9dc0ff, 0.7); rim.position.set(-10, 8, -6); scene.add(rim);

// the comparison window, drawn so the cloud has a place to sit in
const XL = [-3, 17], YL = [-5, 5], ZL = [-5, 5];
const boxG = new THREE.Group();
{
  const g = new THREE.BoxGeometry(XL[1]-XL[0], YL[1]-YL[0], ZL[1]-ZL[0]);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g),
      new THREE.LineBasicMaterial({ color: 0x4a5570, transparent: true, opacity: 0.55 }));
  e.position.set((XL[0]+XL[1])/2, 0, 0);
  boxG.add(e);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(XL[1]-XL[0], YL[1]-YL[0]),
      new THREE.ShadowMaterial({ opacity: 0.34 }));
  floor.position.set((XL[0]+XL[1])/2, 0, ZL[0] + 0.01);
  floor.receiveShadow = true;
  boxG.add(floor);
}
scene.add(boxG);

// ------------------------------------------------------------------- data
function bytes(b64) {
  const raw = atob(b64), n = raw.length, buf = new Uint8Array(n);
  for (let i = 0; i < n; i++) buf[i] = raw.charCodeAt(i);
  return buf;
}
// High-quality shells store uint16 positions quantised over the mesh's own
// bounding box, which halves the payload for the same visual result. Older
// shells store raw float32. Tell them apart by the presence of qlo.
function decode(s) {
  const buf = bytes(s.pos);
  if (!s.qlo) return new Float32Array(buf.buffer);
  const q = new Uint16Array(buf.buffer);
  const out = new Float32Array(q.length);
  const lo = s.qlo, hi = s.qhi;
  const sx = (hi[0] - lo[0]) / 65535, sy = (hi[1] - lo[1]) / 65535, sz = (hi[2] - lo[2]) / 65535;
  for (let i = 0; i < q.length; i += 3) {
    out[i]     = lo[0] + q[i]     * sx;
    out[i + 1] = lo[1] + q[i + 1] * sy;
    out[i + 2] = lo[2] + q[i + 2] * sz;
  }
  return out;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("failed: " + src));
    document.head.appendChild(s);
  });
}

// every frame is built ONCE into a Group and then simply shown or hidden.
// scrubbing and playback never rebuild geometry, which is what keeps it at 60 fps.
let frames = [], times = [], cur = 0, shellOn = [];
let root = new THREE.Group(); scene.add(root);

function clearRun() {
  root.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  scene.remove(root); root = new THREE.Group(); scene.add(root);
  frames = []; times = [];
}

async function showRun(id, label) {
  msg.textContent = "loading " + label + "…";
  msg.style.display = "grid";
  clearRun();
  // prefer the high-quality export when one exists for this run
  let hq = false;
  try {
    if (!VOLHQ_DATA[id]) await loadScript("data/volhq_" + id + ".js");
    hq = !!VOLHQ_DATA[id];
  } catch (e) { hq = false; }
  if (!hq) {
    try {
      if (!VOLSEQ_DATA[id]) await loadScript("data/vol_seq_" + id + ".js");
    } catch (e) {
      try { if (!VOL_DATA[id]) await loadScript("data/vol_" + id + ".js"); }
      catch (e2) { msg.textContent = "no 3D data for " + label; return; }
    }
  }
  const seq = hq ? VOLHQ_DATA[id] : VOLSEQ_DATA[id];
  const single = VOL_DATA[id];
  const list = seq && seq.frames ? seq.frames : (single ? [single.surfs || single.shells || []] : []);
  times = seq && seq.times ? seq.times : [""];
  if (!list.length) { msg.textContent = "no surfaces in " + label; return; }

  let tri = 0;
  list.forEach((surfs, fi) => {
    const g = new THREE.Group(); g.visible = (fi === 0);
    (surfs || []).forEach((s, si) => {
      const pos = decode(s);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.computeVertexNormals();
      const opaque = s.opacity >= 0.9;
      const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(s.color[0], s.color[1], s.color[2]),
        transparent: !opaque, opacity: s.opacity,
        roughness: 0.42, metalness: 0.0, clearcoat: opaque ? 0.35 : 0.0,
        side: THREE.DoubleSide, depthWrite: opaque,
        transmission: opaque ? 0 : 0.08
      });
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = opaque; m.receiveShadow = false;
      m.userData.shell = si;
      g.add(m);
      if (fi === 0) tri += pos.length / 9;
    });
    frames.push(g); root.add(g);
  });

  const sl = document.getElementById("slider");
  sl.min = 0; sl.max = frames.length - 1; sl.value = 0;
  cur = 0; setFrame(0);
  document.getElementById("tris").textContent = Math.round(tri).toLocaleString();
  const meta = (VOL_DATA[id] && VOL_DATA[id].meta) || (seq && seq.meta) || {};
  document.getElementById("gridinfo").textContent =
    (meta.res || "") + (meta.chi ? "  χ = " + meta.chi : "");
  buildShellToggles();
  msg.style.display = "none";
}

function setFrame(i) {
  if (!frames.length) return;
  frames[cur].visible = false;
  cur = Math.max(0, Math.min(frames.length - 1, i));
  frames[cur].visible = true;
  frames[cur].children.forEach(m => {
    if (shellOn.length) m.visible = shellOn[m.userData.shell] !== false;
  });
  document.getElementById("slider").value = cur;
  document.getElementById("tlab").textContent =
    times[cur] !== undefined && times[cur] !== "" ? "t = " + times[cur] + " t_cc"
                                                 : (cur + 1) + " / " + frames.length;
}

function buildShellToggles() {
  const host = document.getElementById("shells"); host.innerHTML = "";
  const n = frames[0] ? frames[0].children.length : 0;
  shellOn = new Array(n).fill(true);
  const names = ["outer", "cloud", "core"];
  for (let i = 0; i < n; i++) {
    const l = document.createElement("label"); l.className = "chk";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = true;
    c.onchange = () => { shellOn[i] = c.checked; setFrame(cur); };
    l.appendChild(c);
    l.appendChild(document.createTextNode(names[i] || ("shell " + (i + 1))));
    host.appendChild(l);
  }
}

// ------------------------------------------------------------- run picker
function runList() {
  const ids = Object.keys(VOL_DATA);
  const seqOnly = Object.keys(VOLSEQ_DATA).filter(i => ids.indexOf(i) < 0);
  return ids.concat(seqOnly);
}
const host = document.getElementById("runs");
// the manifest advertises file stems ("vol_apk3d_chi10"); the dataset id is the
// part after that prefix, and it is what keys VOL_DATA and names the data file
let ids = (window.STUDIO_VOLS && window.STUDIO_VOLS.length) ? window.STUDIO_VOLS.slice() : runList();
if (!ids.length && window.STUDIO_DATA && STUDIO_DATA.vols) ids = STUDIO_DATA.vols.slice();
ids = ids.filter(Boolean)
         .map(s => String(s).replace(/^vol_seq_/, "").replace(/^vol_/, ""))
         .filter((v, i, a) => a.indexOf(v) === i);

const CODE_OF = { apk3d: "AthenaPK (GPU)", athpp3d: "Athena++", athw3d: "Athena 4.2",
                  f3d: "FLASH", flashx3d: "Flash-X", enzo3d: "Enzo", ram3d: "RAMSES",
                  gizmo3d: "GIZMO MFM", arepo3d: "Arepo", gadget3d: "Gadget-4" };
// level = log2(streamwise cells) - 3, so 128 -> 4, 256 -> 5, 512 -> 6
function levelOf(cells) {
  const L = Math.log2(cells) - 3;
  return Number.isFinite(L) ? Math.round(L * 10) / 10 : null;
}
function pretty(id) {
  const m = (VOL_DATA[id] && VOL_DATA[id].meta) || {};
  const pre = (id.match(/^([a-z0-9]+?3d|f3d)/) || [])[1] || "";
  const code = m.code || CODE_OF[pre] || pre.toUpperCase() || id;
  const chiM = id.match(/chi(\d+)/);
  const chi = m.chi || (chiM ? +chiM[1] : null);
  let lvl = null;
  const lM = id.match(/_l(\d+)(?:m|_matched)?$/);
  const cM = id.match(/_(\d{3,4})$/);
  if (lM) lvl = +lM[1];
  else if (cM) lvl = levelOf(+cM[1]);
  const bits = [];
  if (chi) bits.push("χ = " + chi);
  bits.push(lvl !== null ? "level " + lvl : "level ?");
  if (m.res) bits.push(m.res);
  return { title: code, sub: bits.join("  ·  ") };
}

ids.forEach(id => {
  const b = document.createElement("button");
  const p = pretty(id);
  b.innerHTML = p.title + "<span class='m'>" + (p.sub || id) + "</span>";
  b.onclick = () => {
    document.querySelectorAll("#runs button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    stop(); showRun(id, p.title);
    history.replaceState(null, "", "?run=" + encodeURIComponent(id));
  };
  b.dataset.id = id;
  host.appendChild(b);
});

// ---------------------------------------------------------------- playback
let timer = null;
const playBtn = document.getElementById("play");
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.innerHTML = "&#9654;"; } }
playBtn.onclick = () => {
  if (timer) return stop();
  playBtn.innerHTML = "&#10074;&#10074;";
  timer = setInterval(() => setFrame((cur + 1) % frames.length), 90);
};
document.getElementById("prev").onclick = () => { stop(); setFrame(cur - 1); };
document.getElementById("next").onclick = () => { stop(); setFrame(cur + 1); };
document.getElementById("slider").oninput = e => { stop(); setFrame(+e.target.value); };
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  if (e.key === "ArrowLeft") { stop(); setFrame(cur - 1); }
  if (e.key === "ArrowRight") { stop(); setFrame(cur + 1); }
});

document.getElementById("qShadow").onchange = e => { ren.shadowMap.enabled = e.target.checked; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); };
document.getElementById("qBox").onchange = e => { boxG.visible = e.target.checked; };
let spin = false;
document.getElementById("qSpin").onchange = e => { spin = e.target.checked; };
const qScale = document.getElementById("qScale");
qScale.onchange = () => resize(true);

// -------------------------------------------------------------- main loop
let lastW = 0, lastH = 0;
function resize(force) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!force && w === lastW && h === lastH) return;
  lastW = w; lastH = h;
  const dpr = Math.min(+qScale.value || 2, window.devicePixelRatio || 1, 3);
  ren.setPixelRatio(dpr);
  ren.setSize(w, h, false);
  cam.aspect = w / Math.max(h, 1);
  cam.updateProjectionMatrix();
}

let fCount = 0, fLast = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  resize(false);
  if (spin) { ctrl.autoRotate = true; ctrl.autoRotateSpeed = 0.8; } else { ctrl.autoRotate = false; }
  ctrl.update();
  ren.render(scene, cam);
  fCount++;
  if (now - fLast >= 500) {
    document.getElementById("fps").textContent = Math.round(fCount * 1000 / (now - fLast));
    fCount = 0; fLast = now;
  }
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- startup
cam.up.set(0, 0, 1);
ctrl.update();
const want = new URLSearchParams(location.search).get("run");
const first = (want && ids.indexOf(want) >= 0) ? want : ids[0];
if (first) {
  const b = document.querySelector('#runs button[data-id="' + CSS.escape(first) + '"]');
  if (b) b.click(); else showRun(first, first);
} else {
  msg.textContent = "no 3D volumes found";
}
</script>
